[package]
name = "samvadsetu"
version = "1.0.0"
edition = "2024"
description = "Multi-provider LLM API client for Gemini, ChatGPT, Claude, DeepSeek, Qwen, Ollama, and llama.cpp. Supports tool calling, logprobs, structured output, and batch processing. The name implies a bridge for dialogue: Sanskrit saṃvāda (संवाद) = dialogue, setu (सेतु) = bridge."
repository = "https://github.com/sandeep-sandhu/samvadsetu"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/sandeep-sandhu/samvadsetu"
documentation = "https://docs.rs/samvadsetu"
keywords = ["LLMs", "Language_Models", "API", "gemini", "ollama"]
categories = ["api-bindings", "text-processing", "web-programming::http-client"]
readme = "README.md"

[lib]
name = "samvadsetu"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
default = []
async = ["dep:tokio", "reqwest/default"]

[dependencies]
log = "0.4.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.4", features = ["json", "native-tls", "blocking", "http2", "gzip", "multipart"] }
config = "0.15.23"
tokio = { version = "1.52", features = ["full"], optional = true }
